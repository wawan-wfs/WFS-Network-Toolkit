[package]
name = "wenet-secure-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["WFS Project"]
description = "WeNet Toolkit by WFS Project — opt-in secure transport candidate"
publish = false

# Independent manifest until its dependency lock and security acceptance pass.
# The accepted root Cargo.lock is not changed by this experiment.
[workspace]

[dependencies]
wfs-network-toolkit = { path = ".." }
async-snmp = { version = "=0.18.1", default-features = false, features = ["crypto-rustcrypto"] }
tokio = { version = "=1.48.0", features = ["rt", "net", "time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "=2.2.0"
zeroize = "=1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
