name: WeNet Toolkit Windows — build and acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: wenet-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Install stable Rust with lint and format components
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Collect independent build gate results (fail closed)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python scripts/gate_runner.py --out gate-evidence
      - name: Check that the read-only CLI starts
        run: |
          .\target\release\wfs-netctl.exe list
          if ($LASTEXITCODE -ne 0) { throw 'Adapter listing failed' }
          .\target\release\wfs-netctl.exe archive-info
          if ($LASTEXITCODE -ne 0) { throw 'Archive info failed' }
      - name: Smoke test native window and controls without changing network settings
        shell: pwsh
        run: |
          $env:WENET_SMOKE_LOG = Join-Path $PWD 'gate-evidence/native-ui-smoke.log'
          try {
            $p = Start-Process -FilePath .\target\release\WeNet-Toolkit.exe -ArgumentList '--smoke-ui' -PassThru
            if (-not $p.WaitForExit(30000)) {
              Stop-Process -Id $p.Id -Force
              throw "Native UI smoke test timed out"
            }
            if ($p.ExitCode -ne 0) { throw "Native UI smoke test failed ($($p.ExitCode))" }
            if (-not (Test-Path $env:WENET_SMOKE_LOG)) { throw 'Native UI smoke log missing' }
          } finally {
            if (Test-Path $env:WENET_SMOKE_LOG) {
              Get-Content $env:WENET_SMOKE_LOG
            }
            Remove-Item Env:WENET_SMOKE_LOG -ErrorAction SilentlyContinue
          }
      - name: Package portable and installer
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          New-Item -ItemType Directory -Force dist/Portable,dist/Installer | Out-Null
          [ordered]@{ repository = $env:GITHUB_REPOSITORY; commit = $actual; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; event = $env:GITHUB_EVENT_NAME } | ConvertTo-Json | Set-Content dist/BUILD_PROVENANCE.json -Encoding utf8
          git archive --format=zip --output="dist/WeNet-Toolkit-source-$actual.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Copy-Item target/release/WeNet-Toolkit.exe,target/release/wfs-netctl.exe dist/Portable/
          Copy-Item README.md dist/
          Copy-Item docs dist/ -Recurse
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $nsis)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $version = (cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json).packages[0].version
          $setup = (Join-Path $PWD "dist/Installer/WeNet-Toolkit-${version}-x64-Setup.exe")
          $gui = (Resolve-Path target/release/WeNet-Toolkit.exe).Path
          $cli = (Resolve-Path target/release/wfs-netctl.exe).Path
          $readme = (Resolve-Path README.md).Path
          $guide = (Resolve-Path docs/HARDWARE_ACCEPTANCE.md).Path
          Push-Location installer
          try {
            & $nsis /INPUTCHARSET UTF8 "/DGUI_FILE=$gui" "/DCLI_FILE=$cli" "/DREAD_ME=$readme" "/DHARDWARE_GUIDE=$guide" "/DOUT_FILE=$setup" WeNet-Toolkit.nsi
          } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $setup)) { throw 'Installer build failed' }
          Push-Location dist
          try {
            Get-ChildItem -Path Portable,Installer,'BUILD_PROVENANCE.json','WeNet-Toolkit-source-*.zip' -File -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($PWD.Path, $_.FullName).Replace('\','/')
              "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
            } | Set-Content SHA256SUMS.txt -Encoding ascii
          } finally { Pop-Location }
      - name: Upload gate evidence even when validation fails
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: wenet-gate-evidence
          path: gate-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: wenet-toolkit-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 60
